[project]
name = "electric-drive-axle-backend"
version = "1.0.0"
description = "株齿 2.5T 电驱桥下线测试上位机后端 (FastAPI + 周立功 USBCAN)。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1,<1.0.0",
    "python-snap7>=3.1.2,<4",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.15.0,<1.0.0",
]
desktop = [
    "pyinstaller>=6.22.0,<7.0.0",
    "pywebview>=6.2.1,<7.0.0",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
